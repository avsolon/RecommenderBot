services:
  db:
    image: postgres:16-alpine
    container_name: recommender_db
    restart: always
    command: >
      postgres
      -c shared_buffers=256MB
      -c work_mem=8MB
      -c maintenance_work_mem=64MB
      -c effective_cache_size=512MB
      -c wal_buffers=4MB
      -c min_wal_size=256MB
      -c max_wal_size=1GB
      -c max_connections=20
    mem_limit: 512m
    environment:
      POSTGRES_DB: recommender
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  bot:
    build: .
    container_name: recommender_bot
    restart: always
    mem_limit: 256m
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/recommender
    stdin_open: true
    tty: true

  api:
    build: .
    container_name: recommender_api
    restart: always
    mem_limit: 256m
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/recommender
    ports:
      - "8001:8000"
    command: uvicorn web.main:app --host 0.0.0.0 --port 8000

volumes:
  pgdata:
