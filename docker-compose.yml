version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: recommender_db
    restart: always
    environment:
      POSTGRES_DB: recommender
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build: .
    container_name: recommender_bot
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/recommender
    stdin_open: true
    tty: true

  api:
    build: .
    container_name: recommender_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/recommender
    ports:
      - "8000:8000"
    command: uvicorn web.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
